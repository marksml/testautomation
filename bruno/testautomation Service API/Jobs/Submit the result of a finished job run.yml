info:
  name: Submit the result of a finished job run
  type: http
  seq: 6
  tags:
    - Jobs

http:
  method: POST
  url: "{{baseUrl}}/api/v1/jobs/:jobRunId/result"
  params:
    - name: jobRunId
      value: ""
      type: path
      description: Identifier of the run, as returned by `registerJobRun` or `claimJobRun`.
  body:
    type: json
    data: |-
      {
        "status": "PASSED",
        "startedAt": "",
        "finishedAt": "",
        "durationMs": 0,
        "message": "",
        "stackTrace": "",
        "artifacts": [
          {
            "name": "screenshot-login-failure.png",
            "mediaType": "image/png",
            "sizeBytes": 0,
            "uri": "",
            "sha256": ""
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

