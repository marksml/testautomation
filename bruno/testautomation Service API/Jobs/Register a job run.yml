info:
  name: Register a job run
  type: http
  seq: 1
  tags:
    - Jobs

http:
  method: POST
  url: "{{baseUrl}}/api/v1/jobs"
  headers:
    - name: Idempotency-Key
      value: 6f0c2f1e-1b8e-4a4e-9d3f-2b7a6c1d8e44
      description: |
        Optional. A producer that may retry a registration (Jira webhook redelivery, flaky
        network) can send a unique key here; the service then returns the run created for that
        key instead of creating a second one. Without the header, every call creates a run.
  body:
    type: json
    data: |-
      {
        "issueKey": "TEST-4711",
        "testName": "login-smoke",
        "parameters": {
          "browser": "chrome",
          "env": "staging"
        },
        "requiresCapabilities": [
          "api-rest",
          "linux"
        ],
        "priority": 0,
        "maxAttempts": 1
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
