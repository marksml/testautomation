info:
  name: Read one job run
  type: http
  seq: 3
  tags:
    - Jobs

http:
  method: GET
  url: "{{baseUrl}}/api/v1/jobs/:jobRunId"
  params:
    - name: jobRunId
      value: ""
      type: path
      description: Identifier of the run, as returned by `registerJobRun` or `claimJobRun`.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: The run.
    request:
      url: "{{baseUrl}}/api/v1/jobs/:jobRunId"
      method: GET
      params:
        - name: jobRunId
          value: ""
          type: path
          description: Identifier of the run, as returned by `registerJobRun` or `claimJobRun`.
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "jobRunId": "",
            "source": "JIRA",
            "issueKey": "TEST-4711",
            "testName": "",
            "status": "PENDING",
            "attempt": 0,
            "agentId": "",
            "createdAt": "",
            "startedAt": "",
            "finishedAt": "",
            "leaseExpiresAt": "",
            "result": {
              "status": "PASSED",
              "startedAt": "",
              "finishedAt": "",
              "durationMs": 0,
              "message": "",
              "stackTrace": "",
              "artifacts": [
                {
                  "name": "screenshot-login-failure.png",
                  "mediaType": "image/png",
                  "sizeBytes": 0,
                  "uri": "",
                  "sha256": ""
                }
              ]
            }
          }
  - name: 401 Response
    description: Missing or invalid credentials for this role.
    request:
      url: "{{baseUrl}}/api/v1/jobs/:jobRunId"
      method: GET
      params:
        - name: jobRunId
          value: ""
          type: path
          description: Identifier of the run, as returned by `registerJobRun` or `claimJobRun`.
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 409,
            "code": "LEASE_LOST",
            "message": "",
            "details": {}
          }
  - name: 404 Response
    description: No run with this identifier.
    request:
      url: "{{baseUrl}}/api/v1/jobs/:jobRunId"
      method: GET
      params:
        - name: jobRunId
          value: ""
          type: path
          description: Identifier of the run, as returned by `registerJobRun` or `claimJobRun`.
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 409,
            "code": "LEASE_LOST",
            "message": "",
            "details": {}
          }

docs: |
  Current state of the run and, once it is terminal, its result. `DEAD` is a regular status
  here: a run whose attempts were exhausted.
