info:
  name: List job runs
  type: http
  seq: 2
  tags:
    - Jobs

http:
  method: GET
  url: "{{baseUrl}}/api/v1/jobs"
  params:
    - name: issueKey
      value: TEST-4711
      type: query
      description: Only runs of this Jira issue.
    - name: status
      value: PENDING
      type: query
      description: Only runs in this state.
      disabled: true
    - name: status
      value: QUEUED
      type: query
      description: Only runs in this state.
      disabled: true
    - name: status
      value: RUNNING
      type: query
      description: Only runs in this state.
      disabled: true
    - name: status
      value: SUCCEEDED
      type: query
      description: Only runs in this state.
      disabled: true
    - name: status
      value: FAILED
      type: query
      description: Only runs in this state.
      disabled: true
    - name: status
      value: ERROR
      type: query
      description: Only runs in this state.
      disabled: true
    - name: status
      value: SKIPPED
      type: query
      description: Only runs in this state.
      disabled: true
    - name: status
      value: CANCELLED
      type: query
      description: Only runs in this state.
      disabled: true
    - name: status
      value: DEAD
      type: query
      description: Only runs in this state.
      disabled: true
    - name: limit
      value: "20"
      type: query
    - name: offset
      value: "0"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

