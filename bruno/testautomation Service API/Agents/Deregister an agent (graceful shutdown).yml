info:
  name: Deregister an agent (graceful shutdown)
  type: http
  seq: 4
  tags:
    - Agents

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/agents/:agentId"
  params:
    - name: agentId
      value: agent-01
      type: path
      description: Stable identifier an agent uses to register itself.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 204 Response
    description: Agent marked offline.
    request:
      url: "{{baseUrl}}/api/v1/agents/:agentId"
      method: DELETE
      params:
        - name: agentId
          value: agent-01
          type: path
          description: Stable identifier an agent uses to register itself.
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""
  - name: 401 Response
    description: Missing or invalid credentials for this role.
    request:
      url: "{{baseUrl}}/api/v1/agents/:agentId"
      method: DELETE
      params:
        - name: agentId
          value: agent-01
          type: path
          description: Stable identifier an agent uses to register itself.
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 409,
            "code": "LEASE_LOST",
            "message": "",
            "details": {}
          }
  - name: 404 Response
    description: No agent with this identifier.
    request:
      url: "{{baseUrl}}/api/v1/agents/:agentId"
      method: DELETE
      params:
        - name: agentId
          value: agent-01
          type: path
          description: Stable identifier an agent uses to register itself.
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 409,
            "code": "LEASE_LOST",
            "message": "",
            "details": {}
          }

docs: |
  Marks the agent `OFFLINE` instead of waiting for the liveness window to pass. Does **not**
  cancel runs the agent currently holds — their leases expire and the reaper re-queues them.
