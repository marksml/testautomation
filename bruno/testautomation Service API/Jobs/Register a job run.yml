docs: |
  Creates a **new, independent run**: the service generates the `jobRunId` and returns it.
  Registering the same payload twice produces two runs, both executed — there is no
  de-duplication and no overwrite.

  **Which kind of run is created is decided implicitly by the payload:**

  * `issueKey` set → **Jira-backed run** (`source: JIRA`). The details are collected from Jira
    by a scheduled job inside the service, *after* this call returns, and the result is pushed
    back to Jira when the run finishes. Whether the caller is the Jira client or a curl call
    does not matter — what matters is that the details live in Jira. The run is `PENDING` until
    the collection has filled them in, and is not claimable before that.
  * `issueKey` empty, `testName` set → **ad-hoc run** (`source: AD_HOC`). Nothing is fetched
    from Jira and nothing is pushed to Jira; the result is only readable through
    `GET /api/v1/jobs` (the desktop component polls, it is not notified actively). Starts as
    `QUEUED`, immediately claimable.
  * neither set → `400`.

  Each finished run is pushed to Jira on its own, regardless of which run of that issue
  finishes last. This endpoint never waits for Jira: it persists and answers `200`.
