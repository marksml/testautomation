      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 409,
            "code": "LEASE_LOST",
            "message": "",
            "details": {}
          }
  - name: 401 Response
    description: Missing or invalid credentials for this role.
    request:
      url: "{{baseUrl}}/api/v1/jobs"
      method: POST
